<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPG com Mestre IA — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="entrada">
    <section class="entrada-arte" aria-labelledby="titulo">
      <h1 id="titulo">Uma mesa de RPG onde o Mestre nunca falta</h1>
      <p>Monte seu personagem, convide o grupo com um código e explore um mundo que a IA inventa e ilustra enquanto vocês jogam, tudo em tempo real.</p>
    </section>

    <section class="entrada-form">
      <div class="card">
        <div class="abas" role="tablist" aria-label="Acesso">
          <button class="aba" role="tab" id="aba-login" aria-selected="true" aria-controls="painel-login">Entrar</button>
          <button class="aba" role="tab" id="aba-cadastro" aria-selected="false" aria-controls="painel-cadastro">Criar conta</button>
        </div>

        <p id="erro" class="aviso aviso-erro" role="alert" hidden></p>

        <form id="painel-login" role="tabpanel" aria-labelledby="aba-login" novalidate>
          <div class="campo">
            <label for="login-email">E-mail</label>
            <input id="login-email" type="email" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="login-senha">Senha</label>
            <input id="login-senha" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primario" type="submit" style="width:100%">Entrar</button>
        </form>

        <form id="painel-cadastro" role="tabpanel" aria-labelledby="aba-cadastro" hidden novalidate>
          <div class="campo">
            <label for="cad-nome">Seu nome</label>
            <input id="cad-nome" type="text" autocomplete="name" maxlength="80" required>
          </div>
          <div class="campo">
            <label for="cad-email">E-mail</label>
            <input id="cad-email" type="email" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="cad-senha">Senha</label>
            <input id="cad-senha" type="password" autocomplete="new-password" minlength="6" required>
            <p class="dica">Mínimo de 6 caracteres.</p>
          </div>
          <button class="btn btn-primario" type="submit" style="width:100%">Criar conta e entrar</button>
        </form>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
